# Authentik OIDC provider for local and Kubernetes SSO.
#
# This is a development/reference deployment with fixed development secrets.
# Do not use these credentials in production.
#
# Alternative to Dex, to prove the OIDC wiring is provider-agnostic.
#
# Admin login (Authentik UI at http://localhost:29020):
#   username: akadmin
#   password: password
#   email:    admin@example.com   (this is what the authz grant matches)
#
# OAuth2 client used by MonoFS / Guardian (auto-provisioned via blueprint):
#   client_id:     monofs
#   client_secret: monofs-oidc-secret
#   issuer:        http://authentik.authentik.svc.cluster.local:9000/application/o/monofs/
#
# NOTE: Authentik blueprint schema is version-specific; this targets the pinned
# image below. The OIDC verification/wiring in the router/guardiand is standard
# OIDC discovery + JWKS and is identical to the Dex path.
---
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
  labels:
    app.kubernetes.io/part-of: strata-authz
---
apiVersion: v1
kind: Secret
metadata:
  name: authentik
  namespace: authentik
stringData:
  # Dev-only fixed values. Do NOT use in production.
  AUTHENTIK_SECRET_KEY: "dev-authentik-secret-key-change-me-0123456789abcdef"
  POSTGRES_PASSWORD: "authentik"
  AUTHENTIK_BOOTSTRAP_PASSWORD: "password"
  AUTHENTIK_BOOTSTRAP_EMAIL: "admin@example.com"
  AUTHENTIK_BOOTSTRAP_TOKEN: "dev-authentik-bootstrap-token"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint
  namespace: authentik
data:
  monofs.yaml: |
    version: 1
    metadata:
      name: monofs-oauth2
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: monofs
        attrs:
          name: monofs
          client_type: confidential
          client_id: monofs
          client_secret: monofs-oidc-secret
          # Username is always present, including for the auto-created
          # client-credentials service account. user_email produced an empty
          # "sub" for that account, so Doctor treated the agent as anonymous.
          sub_mode: user_username
          include_claims_in_id_token: true
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          device_authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key:
            !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          redirect_uris:
            - matching_mode: strict
              url: "http://localhost:18080/auth/callback"
            - matching_mode: strict
              url: "http://127.0.0.1:18080/auth/callback"
            - matching_mode: strict
              url: "http://127.0.0.1:18090/auth/callback"
            - matching_mode: strict
              url: "http://127.0.0.1:18081/auth/callback"
            - matching_mode: strict
              url: "http://127.0.0.1:28090/auth/callback"
            - matching_mode: strict
              url: "http://127.0.0.1:28080/auth/callback"
            - matching_mode: strict
              url: "http://127.0.0.1:28081/auth/callback"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      - model: authentik_core.application
        identifiers:
          slug: monofs
        attrs:
          name: MonoFS
          slug: monofs
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, monofs]]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: authentik
  labels: { app: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: authentik
            - name: POSTGRES_USER
              value: authentik
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: authentik, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [ { containerPort: 5432 } ]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "authentik"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: authentik
spec:
  selector: { app: postgres }
  ports: [ { port: 5432, targetPort: 5432 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: authentik
  labels: { app: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [ { containerPort: 6379 } ]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: authentik
spec:
  selector: { app: redis }
  ports: [ { port: 6379, targetPort: 6379 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
  labels: { app: authentik-server }
spec:
  replicas: 1
  selector: { matchLabels: { app: authentik-server } }
  template:
    metadata: { labels: { app: authentik-server } }
    spec:
      containers:
        - name: server
          image: ghcr.io/goauthentik/server:2024.10.5
          args: ["server"]
          envFrom:
            - secretRef: { name: authentik }
          env:
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: postgres
            - name: AUTHENTIK_POSTGRESQL__USER
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom: { secretKeyRef: { name: authentik, key: POSTGRES_PASSWORD } }
            - name: AUTHENTIK_REDIS__HOST
              value: redis
          ports:
            - { name: http, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /-/health/ready/, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/custom
              readOnly: true
      volumes:
        - name: blueprints
          configMap: { name: authentik-blueprint }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: authentik
  labels: { app: authentik-worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: authentik-worker } }
  template:
    metadata: { labels: { app: authentik-worker } }
    spec:
      containers:
        - name: worker
          image: ghcr.io/goauthentik/server:2024.10.5
          args: ["worker"]
          envFrom:
            - secretRef: { name: authentik }
          env:
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: postgres
            - name: AUTHENTIK_POSTGRESQL__USER
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom: { secretKeyRef: { name: authentik, key: POSTGRES_PASSWORD } }
            - name: AUTHENTIK_REDIS__HOST
              value: redis
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/custom
              readOnly: true
      volumes:
        - name: blueprints
          configMap: { name: authentik-blueprint }
---
apiVersion: v1
kind: Service
metadata:
  name: authentik
  namespace: authentik
  labels: { app: authentik-server }
spec:
  selector: { app: authentik-server }
  ports:
    - { name: http, port: 9000, targetPort: 9000 }
