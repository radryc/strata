apiVersion: v1
kind: ServiceAccount
metadata:
  name: guardian-pusher-k8s
  namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: strata-guardian-pusher
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - services
      - configmaps
      - secrets
      - serviceaccounts
      - persistentvolumeclaims
      - pods
      - pods/log
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: strata-guardian-pusher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: strata-guardian-pusher
subjects:
  - kind: ServiceAccount
    name: guardian-pusher-k8s
    namespace: __NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardiand
  namespace: __NAMESPACE__
  labels: { app: guardiand }
spec:
  replicas: 1
  selector:
    matchLabels: { app: guardiand }
  template:
    metadata:
      labels: { app: guardiand }
    spec:
      containers:
        - name: guardiand
          image: __IMAGE_PREFIX__/guardiand:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: GUARDIAN_MONOFS_ROUTER
              value: monofs-router.__NAMESPACE__.svc.cluster.local:9090
            - name: GUARDIAN_MONOFS_CLIENT_API_ENDPOINT
              value: 127.0.0.1:19090
            - name: GUARDIAN_MONOFS_TOKEN
              valueFrom:
                secretKeyRef: { name: strata-secrets, key: MONOFS_TOKEN }
            - name: GUARDIAN_MONOFS_PRINCIPAL
              value: guardiand
            - name: GUARDIAN_PRINCIPAL_ID
              value: guardiand
            - name: GUARDIAN_UI_LISTEN
              value: 0.0.0.0:8090
            - name: GUARDIAN_UI_BASE_URL
              value: http://127.0.0.1:18090
            - name: GUARDIAN_PUSHERS
              value: k8s-main:/.queues/k8s-main
            - name: GUARDIAN_REPO_IMPORT_ENABLED
              value: "true"
            - name: GUARDIAN_REPO_IMPORT_INTERVAL
              value: 30s
            - name: GUARDIAN_REPO_IMPORT_SHARDS
              value: "1"
            - name: GUARDIAN_REPO_IMPORT_LEASE
              value: "false"
            - name: GUARDIAN_RECONCILE_INTERVAL
              value: 1m
          ports:
            - { name: http, containerPort: 8090 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: guardiand
  namespace: __NAMESPACE__
spec:
  selector: { app: guardiand }
  ports:
    - { name: http, port: 8090, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardian-pusher-k8s
  namespace: __NAMESPACE__
  labels: { app: guardian-pusher-k8s }
spec:
  replicas: 1
  selector:
    matchLabels: { app: guardian-pusher-k8s }
  template:
    metadata:
      labels: { app: guardian-pusher-k8s }
    spec:
      serviceAccountName: guardian-pusher-k8s
      containers:
        - name: pusher
          image: __IMAGE_PREFIX__/guardian-pusher-k8s:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: GUARDIAN_PUSHER_NAME
              value: k8s-main
            - name: GUARDIAN_CLUSTER
              value: k8s-main
            - name: GUARDIAN_MONOFS_ROUTER
              value: monofs-router.__NAMESPACE__.svc.cluster.local:9090
            - name: GUARDIAN_MONOFS_TOKEN
              valueFrom:
                secretKeyRef: { name: strata-secrets, key: MONOFS_TOKEN }
            - name: GUARDIAN_MONOFS_USE_EXTERNAL_ADDRESSES
              value: "false"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
